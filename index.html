
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saifal Player</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:white;
 font-family:Arial,sans-serif;padding:22px;
}
.app{max-width:450px;margin:auto;text-align:center}
h1{color:#38bdf8;font-size:30px}
.sub{color:#94a3b8}
.cover{
 width:210px;height:210px;margin:35px auto 20px;
 border-radius:30px;background:linear-gradient(135deg,#0ea5e9,#7c3aed);
 display:flex;align-items:center;justify-content:center;
 font-size:85px;box-shadow:0 10px 40px #0008;
}
h2{font-size:22px;overflow-wrap:anywhere}
p{color:#94a3b8}
button{
 border:0;border-radius:14px;padding:13px;
 background:#17243b;color:white;font-size:17px;
 cursor:pointer;
}
button:active{opacity:.7}
.primary{background:#0ea5e9;color:white}
.controls{display:flex;justify-content:center;gap:14px;margin:22px 0}
.controls button{font-size:22px;min-width:55px}
input[type=range]{width:100%;accent-color:#0ea5e9}
.time{display:flex;justify-content:space-between;color:#94a3b8;font-size:13px}
.upload{display:block;margin:20px auto;background:#0ea5e9;padding:14px;border-radius:14px;cursor:pointer}
.upload input{display:none}
.song{
 display:flex;align-items:center;gap:12px;
 background:#17243b;padding:13px;margin:9px 0;
 border-radius:12px;text-align:left;
}
.song button{background:#243650}
.song.active{border:1px solid #38bdf8}
.songname{flex:1;overflow-wrap:anywhere}
#playlist{margin-top:25px}
.small{font-size:13px;color:#94a3b8}
</style>
</head>
<body>
<div class="app">

<h1>🎵 Saifal Player</h1>
<p class="sub">Your Personal Music Player</p>

<div class="cover">🎧</div>

<h2 id="title">No Song Selected</h2>
<p id="artist">Choose songs from your phone</p>

<audio id="audio"></audio>

<div class="time">
<span id="current">0:00</span>
<span id="duration">0:00</span>
</div>

<input type="range" id="seek" value="0" min="0" max="100">

<div class="controls">
<button id="prev">⏮</button>
<button class="primary" id="play">▶</button>
<button id="next">⏭</button>
</div>

<p>🔊 Volume</p>
<input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">

<label class="upload">
＋ Add Songs From Phone
<input type="file" id="files" accept="audio/*,.mp3,.m4a,.wav,.ogg" multiple>
</label>

<p class="small">Select MP3 or other supported audio files</p>

<div id="playlist">
<h3>🎶 My Playlist</h3>
<div id="songs">
<p class="small">Your songs will appear here.</p>
</div>
</div>

</div>

<script>
const audio=document.getElementById("audio");
const play=document.getElementById("play");
const files=document.getElementById("files");
const title=document.getElementById("title");
const artist=document.getElementById("artist");
const songsBox=document.getElementById("songs");
const seek=document.getElementById("seek");
const current=document.getElementById("current");
const duration=document.getElementById("duration");
const volume=document.getElementById("volume");

let playlist=[];
let index=-1;

function formatTime(t){
 if(!Number.isFinite(t))return "0:00";
 return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
}

function loadSong(i){
 if(i<0||i>=playlist.length)return;
 index=i;
 audio.src=playlist[index].url;
 title.textContent=playlist[index].name;
 artist.textContent="Saifal Player • Now Selected";
 render();
 audio.play().then(()=>{
 play.textContent="⏸";
 }).catch(()=>{
 play.textContent="▶";
 });
}

function render(){
 songsBox.innerHTML="";
 playlist.forEach((song,i)=>{
  const row=document.createElement("div");
  row.className="song"+(i===index?" active":"");
  const name=document.createElement("span");
  name.className="songname";
  name.textContent="🎵 "+song.name;
  const btn=document.createElement("button");
  btn.textContent=i===index&& !audio.paused?"⏸":"▶";
  btn.onclick=()=>loadSong(i);
  row.append(name,btn);
  songsBox.appendChild(row);
 });
}

files.addEventListener("change",()=>{
 const selected=Array.from(files.files);
 selected.forEach(file=>{
  if(file.type.startsWith("audio/")||
     /\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(file.name)){
   playlist.push({
    name:file.name,
    url:URL.createObjectURL(file)
   });
  }
 });
 render();
 if(index===-1&&playlist.length)loadSong(0);
 files.value="";
});

play.onclick=()=>{
 if(index===-1){
  if(playlist.length)loadSong(0);
  else files.click();
  return;
 }
 if(audio.paused){
  audio.play();
 }else{
  audio.pause();
 }
};

audio.onplay=()=>play.textContent="⏸";
audio.onpause=()=>play.textContent="▶";

document.getElementById("prev").onclick=()=>{
 if(playlist.length)loadSong((index-1+playlist.length)%playlist.length);
};

document.getElementById("next").onclick=()=>{
 if(playlist.length)loadSong((index+1)%playlist.length);
};

audio.ontimeupdate=()=>{
 if(audio.duration){
  seek.value=(audio.currentTime/audio.duration)*100;
  current.textContent=formatTime(audio.currentTime);
 }
};

audio.onloadedmetadata=()=>{
 duration.textContent=formatTime(audio.duration);
};

seek.oninput=()=>{
 if(audio.duration)audio.currentTime=(seek.value/100)*audio.duration;
};

volume.oninput=()=>audio.volume=volume.value;
audio.volume=0.8;

audio.onended=()=>{
 if(playlist.length)loadSong((index+1)%playlist.length);
};

</script>
</body>
</html>
